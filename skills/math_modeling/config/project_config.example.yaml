schema_version: 2

project:
  id: example_project
  title: "数学建模项目"
  competition: "CUMCM|MCM|ICM|other"
  language: zh-CN
  timezone: Asia/Shanghai
  root: "<project>/"

paths:
  problem_statement: "<project>/inputs/problem.pdf"
  attachments: "<project>/inputs/"
  registry:
    parameters: "<project>/registry/parameters.yaml"
    formulas: "<project>/registry/formulas.yaml"
    model_contracts: "<project>/registry/model_contracts.yaml"
  modeling_artifacts: "<project>/artifacts/modeling/"
  architecture_artifacts: "<project>/artifacts/architecture/"
  agent_runs: "<project>/artifacts/agents/"
  reference_artifacts: "<project>/artifacts/references/"
  paper_sections: "<project>/sections/"
  results: "<project>/results/"
  figures: "<project>/figures/"

units:
  system: SI
  length: m
  time: s
  speed: m/s
  angle: rad
  conversion_required_before_modeling: true

orchestration:
  mode: workflow_first
  workflow_map: "skills/math_modeling/workflows/README.md"
  default_entry: router
  allowed_agent_slots:
    - route_explorer
    - diagnostic_agent
    - solution_reviewer
  forbid_unregistered_agent_types: true
  require_human_route_decision: true
  require_modeling_packet: true
  require_paper_blueprint: true
  allow_direct_paper_writing: false
  require_registry_update: true
  require_validation_before_writing: true

agent_policy:
  admission_gate: "skills/math_modeling/support/AGENT_ADMISSION_GATE.md"
  runtime_contract: "skills/math_modeling/support/AGENT_RUNTIME_CONTRACT.md"
  require_admission_record: true
  require_environment_manifest: true
  require_tool_contracts: true
  require_prompt_contract: true
  require_rollback_point: true
  require_error_detection: true
  autonomous_action_allowed_only_when_errors_detectable: true
  default_decision: workflow
  silent_failure_risk_allowed: low
  global_budget:
    max_iterations: 6
    max_tool_calls: 12
    max_candidate_routes: 4
  stop_conditions:
    - budget_exhausted
    - two_iterations_without_new_evidence
    - unverifiable_critical_assumption
    - tool_state_conflict
    - global_artifact_contamination_risk
    - human_value_judgment_required

workflow_policy:
  deterministic_steps_required_for:
    - project_initialization
    - problem_intake
    - unit_conversion
    - parameter_registration
    - model_specification
    - standard_implementation
    - result_validation
    - registry_updates
    - paper_architecture
    - paper_writing
    - delivery_checks
  validation_rules_predefined_when_possible: true
  fixed_failure_tree_before_diagnostic_agent: true

reference_isolation:
  protocol: "skills/math_modeling/support/REFERENCE_ISOLATION_PROTOCOL.md"
  default_mode: independent_first_reference_second
  classify_sources_at_W0: true
  require_reference_exposure_log: true
  reference_exposure_log: "<project>/artifacts/references/reference_exposure_log.yaml"
  require_independent_baseline_freeze: true
  independent_baseline: "<project>/artifacts/references/independent_baseline.yaml"
  require_human_reference_release: true
  reference_comparison: "<project>/artifacts/references/reference_comparison.yaml"
  adoption_decisions: "<project>/artifacts/references/adoption_decisions.yaml"
  same_problem_solution_search_before_baseline_freeze: forbidden
  external_reference_paths_readable_before_release: false
  accidental_exposure_marks_run_contaminated: true
  contaminated_run_policy: assisted_baseline_or_fresh_rerun
  allow_domain_fact_search_before_release: true
  domain_fact_search_must_log_query_and_use: true

runtime:
  environment:
    explicit_readable_paths: true
    explicit_writable_paths: true
    immutable_paths_required: true
    unavailable_information_must_be_declared: true
    reference_paths_must_follow_release_state: true
  tools:
    structured_inputs_required: true
    failure_signal_required: true
    side_effect_verification_required: true
    bounded_retry_required: true
    web_search_must_respect_reference_isolation: true
  prompt:
    success_criteria_required: true
    unknowns_required: true
    allowed_and_forbidden_actions_required: true
    output_schema_required: true
    escalation_conditions_required: true
    reference_access_state_required: true

modeling:
  stable_formula_ids: true
  final_equation_numbers: false
  minimum_candidate_routes: 2
  maximum_candidate_routes: 4
  validation_required:
    - residual_or_constraint_check
    - stability_or_sensitivity_check
  allow_partial_result: true
  partial_result_must_be_labeled: true

innovation:
  mode: gated_optional
  explorer: "skills/math_modeling/support/INNOVATION_EXPLORER.md"
  goal: problem_specific_and_verifiable
  forbid_unverified_originality_claims: true
  require_baseline_comparison: true
  require_user_decision_record: true
  invoke_only_after_agent_admission: true
  respect_reference_isolation_phase: true

solution_review:
  mode: gated_optional
  reviewer: "skills/math_modeling/support/SOLUTION_REVIEW_AGENT.md"
  invoke_after_basic_validation: true
  critical_findings_block_progress: true
  reviewer_cannot_modify_registries: true
  separate_internal_review_from_reference_comparison: true

paper_architecture:
  equation_numbering: global
  figure_numbering: chapter
  table_numbering: chapter
  one_owner_per_formula: true
  one_owner_per_model: true
  common_assumptions_once: true
  common_symbol_table_once: true
  formula_reuse_policy: reference_only
  page_limit: null

paper_writing:
  style: formal_academic
  final_formats:
    - latex
  include_tool_process_in_body: false
  include_failed_routes_in_body: false
  result_explanation_level: concise
  figure_caption_position: below
  table_caption_position: above
  editable_equations_required: true
  exploration_agents_forbidden: true
  provenance_required_for_reference_influenced_content: true

question_delivery:
  mode: all_at_once  # all_at_once | sequential_review
  problem_order: []
  require_approved_review_before_next: false
  review_formats:
    - conversation
    - latex
  review_records: "<project>/review/"
  review_gate: "skills/math_modeling/support/PROBLEM_REVIEW_GATE.md"
  review_validator: "skills/math_modeling/validation/problem_review_validator.py"

context_budget:
  read_entire_repository: false
  load_only:
    - current_workflow_or_agent_rule
    - project_config
    - current_problem_inputs
    - project_registries
    - direct_dependencies
    - explicit_environment_manifest
    - released_reference_artifacts_only
  prefer_registry_over_previous_full_text: true

compatibility:
  formula_reuse_protocol: "skills/math_modeling/FORMULA_REUSE_PROTOCOL.md"
  formula_reuse_checker: "skills/math_modeling/checks/check_formula_reuse.py"
  preserve_existing_project_directories: true

quality_gates:
  independent_modeling_to_reference_release:
    - source_classes_recorded
    - exposure_status_recorded
    - independent_baseline_frozen
    - baseline_hash_recorded
    - human_reference_release_approved
  modeling_to_architecture:
    - outputs_covered
    - route_decision_recorded
    - reproducible_model_and_algorithm
    - quantitative_validation
    - agent_actions_auditable
    - reference_provenance_recorded
    - no_open_critical_review_findings
    - constraints_separated_from_writing
  architecture_to_writing:
    - unique_model_ownership
    - unique_formula_labels
    - inheritance_and_new_content_defined
    - no_open_critical_issues
  writing_to_delivery:
    - no_redefinition
    - no_number_conflict
    - result_attachment_consistency
    - required_outputs_present
