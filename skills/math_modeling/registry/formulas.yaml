# 公式库
# 用途：登记已经建立过的公式和模型。后续章节写作时，先检查本文件，已有公式只引用不重复推导。

bench_dragon:
  common_parameters:
    board_count:
      value: 223
      meaning: "板凳总节数"
    handle_count:
      value: 224
      meaning: "把手中心总数"
    board_width:
      symbol: "w"
      value: 0.30
      unit: "m"
    hole_to_head:
      symbol: "c"
      value: 0.275
      unit: "m"
    head_hole_distance:
      symbol: "d_0"
      value: 2.86
      unit: "m"
    body_hole_distance:
      symbol: "d_i"
      value: 1.65
      unit: "m"

  problem1:
    p1_spiral_equation:
      label: "eq:p1-spiral"
      name: "等距螺线极坐标方程"
      meaning: "定义等距螺线 r=k theta, k=p/(2pi)"
      first_defined_in: "problem1"
      reuse_rule: "后续问题只允许引用或参数替换，不允许重新推导"
      forbidden_redefine: true
    p1_position_vector:
      label: "eq:p1-position-vector"
      name: "等距螺线直角坐标表示"
      meaning: "把角参数 theta 映射为平面坐标"
      first_defined_in: "problem1"
      reuse_rule: "后续问题不得重复展开，只能引用"
      forbidden_redefine: true
    p1_arc_length:
      label: "eq:p1-arc-length"
      name: "螺线弧长函数"
      meaning: "建立龙头前把手弧长与角参数之间的关系"
      first_defined_in: "problem1"
      reuse_rule: "后续问题不得重复推导积分过程"
      forbidden_redefine: true
    p1_head_motion:
      label: "eq:p1-head-theta"
      name: "龙头前把手运动模型"
      meaning: "由弧长约束确定龙头前把手角参数"
      first_defined_in: "problem1"
      reuse_rule: "后续问题若涉及龙头位置，应引用或说明参数替换"
      forbidden_redefine: true
    p1_theta_recursion:
      label: "eq:p1-theta-recursion"
      name: "相邻把手位置递推模型"
      meaning: "由刚性孔距约束递推全部把手位置"
      first_defined_in: "problem1"
      reuse_rule: "后续问题只调用，不重复建立"
      forbidden_redefine: true
    p1_speed_recursion:
      label: "eq:p1-speed-recursion"
      name: "把手速度递推模型"
      meaning: "由刚性板凳速度投影约束递推速度"
      first_defined_in: "problem1"
      reuse_rule: "后续问题只引用递推思想或式号"
      forbidden_redefine: true

  problem2:
    p2_rectangle_model:
      label: "eq:p2-simple-rectangle"
      name: "板凳矩形实体模型"
      meaning: "用中心点、轴向、法向、半长、半宽表示板凳实体区域"
      first_defined_in: "problem2"
      reuse_rule: "问题三至问题五若需要实体区域，直接引用，不重复构造"
      forbidden_redefine: true
    p2_pair_margin:
      label: "eq:p2-simple-pair-margin"
      name: "单对非相邻板凳安全分离裕度"
      meaning: "基于候选轴投影的矩形分离判定"
      first_defined_in: "problem2"
      reuse_rule: "后续碰撞/安全问题直接调用"
      forbidden_redefine: true
    p2_global_margin:
      label: "eq:p2-simple-global-margin"
      name: "全队非相邻板凳整体安全裕度"
      meaning: "对全部非相邻板凳对取最小安全裕度"
      first_defined_in: "problem2"
      reuse_rule: "问题三可直接以该裕度作为可行性约束"
      forbidden_redefine: true

  problem3:
    p3_pitch_margin:
      label: "eq:p3-pitch-margin"
      name: "候选螺距最小安全裕度"
      meaning: "对 rho 区间搜索得到 F(p)"
      first_defined_in: "problem3"
      reuse_rule: "后续若讨论最小螺距结果，可直接引用"
      forbidden_redefine: false
    p3_min_pitch:
      label: "eq:p3-min-pitch"
      name: "最小螺距优化模型"
      meaning: "定义 p_min 为满足安全裕度非负的最小螺距"
      first_defined_in: "problem3"
      reuse_rule: "后续引用结果，不重复构造优化问题"
      forbidden_redefine: true

  problem4:
    p4_unified_path:
      label: "eq:p4-path"
      name: "统一路径弧长参数化"
      meaning: "将盘入、S形调头和盘出统一为 Gamma(s)"
      first_defined_in: "problem4"
      reuse_rule: "问题五必须直接引用"
      forbidden_redefine: true

  problem5:
    p5_speed_scale:
      label: "eq:p5-max-lambda"
      name: "最大速度放大系数"
      meaning: "单位龙头速度下全路径、全把手最大速度比例"
      first_defined_in: "problem5"
      reuse_rule: "用于计算最大龙头速度"
      forbidden_redefine: false
