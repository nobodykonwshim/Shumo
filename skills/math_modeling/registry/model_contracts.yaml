# 数学建模模型边界规则库
# 用途：写新问题前先读取本文件，判断哪些模型必须引用、哪些公式禁止重复定义、哪些内容允许新增。

global_rules:
  must_do_before_writing:
    - "列出前文已建立模型"
    - "列出本问允许新增模型"
    - "列出本问禁止重复定义内容"
    - "写作时优先使用已有式号引用"
    - "输出前进行重复公式审查"
  forbidden_general_phrases_when_reused:
    - "重新建立"
    - "再次推导"
    - "等距螺线的极坐标方程为"
    - "直角坐标系下表示为"
    - "螺线弧长函数为"
  preferred_reuse_phrases:
    - "沿用前文模型"
    - "调用式"
    - "将前文模型中的参数替换为"
    - "不再重复推导"
    - "只针对本问新增变量进行建模"

bench_dragon:
  project_name: "板凳龙"
  common_reuse_policy:
    - "基础螺线方程只在问题一完整出现一次"
    - "板凳矩形实体模型只在问题二完整出现一次"
    - "碰撞判定模型只在问题二完整出现一次"
    - "后续问题必须通过式号引用已有模型"

  problem1:
    role: "基础运动模型"
    allowed_new_models:
      - "等距螺线方程"
      - "直角坐标表示"
      - "弧长函数"
      - "龙头前把手运动模型"
      - "相邻把手位置递推模型"
      - "速度递推模型"
    forbidden_redefine: []

  problem2:
    role: "实体碰撞与终止时刻"
    must_reference:
      - "问题一等距螺线模型"
      - "问题一位置递推模型"
      - "问题一速度递推模型"
    allowed_new_models:
      - "板凳矩形实体模型"
      - "非相邻板凳碰撞判定模型"
      - "终止时刻搜索模型"
    forbidden_redefine:
      - "等距螺线极坐标方程"
      - "等距螺线直角坐标表达"
      - "弧长函数完整推导"
      - "龙头前把手位置运动模型完整推导"

  problem3:
    role: "最小螺距可行性搜索"
    must_reference:
      - "问题一等距螺线位置递推模型"
      - "问题二板凳矩形实体模型"
      - "问题二非相邻板凳碰撞判定模型"
    allowed_new_models:
      - "候选螺距 p"
      - "龙头半径区间 rho in [R, 16p]"
      - "构型安全裕度 H(rho,p)"
      - "候选螺距最小安全裕度 F(p)"
      - "最小螺距优化模型 p_min"
      - "外层二分与内层安全裕度搜索"
    forbidden_redefine:
      - "等距螺线极坐标方程"
      - "等距螺线直角坐标表达"
      - "螺线弧长函数"
      - "龙头前把手位置模型"
      - "相邻把手位置递推模型"
      - "板凳矩形实体模型"
      - "非相邻板凳碰撞判定模型"
    required_boundary_sentence: "本问不再重复建立螺线位置模型，而是将问题一中已有模型的螺距参数替换为候选值 p，并沿用问题二中的安全裕度判定模型判断可行性。"

  problem4:
    role: "S形调头路径与统一路径参数化"
    must_reference:
      - "问题一位置递推思想"
      - "问题一速度递推思想"
      - "问题二实体几何参数"
    allowed_new_models:
      - "盘出螺线与盘入螺线的中心对称关系"
      - "两段圆弧S形调头曲线"
      - "相切条件"
      - "半径比约束"
      - "调头曲线唯一性证明"
      - "统一路径弧长参数化"
    forbidden_redefine:
      - "问题一完整等距螺线推导"
      - "问题一完整位置递推推导"
      - "问题一完整速度递推推导"
      - "问题二完整碰撞判定模型"

  problem5:
    role: "最大龙头速度"
    must_reference:
      - "问题四统一路径模型"
      - "问题四速度递推关系"
    allowed_new_models:
      - "单位龙头速度下的速度放大系数"
      - "全路径最大速度放大系数"
      - "龙头最大速度计算公式"
      - "临界时刻与最坏把手识别"
    forbidden_redefine:
      - "问题四路径几何模型"
      - "问题四S形圆弧推导"
      - "问题四完整位置递推"
      - "问题四完整速度递推来源"

review_before_output:
  - "检查是否重复定义前文公式"
  - "检查本问是否只新增必要变量和约束"
  - "检查是否使用已有式号引用"
  - "检查公式标签是否冲突"
  - "检查章节开头是否说明模型继承关系"
