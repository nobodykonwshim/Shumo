schema_version: "1.0"
spec_id: MODEL-CASE002-P1
problem_id: problem1
title: Missile-view perspective projection and full smoke coverage model
status: solved

objective:
  sense: estimate
  description: Determine the interval during which the true target perspective projection is completely covered by the projected smoke shadow from missile M1.
  metrics:
    - id: METRIC-P1-COVERAGE-DURATION
      description: Effective full-projection coverage duration
      priority: primary
      formula_id: F-P1-EFFECTIVE-DURATION
      unit: s

inputs:
  - id: IN-P1-KINEMATICS
    description: Missile, FY1, bomb and smoke motion parameters referenced from the parameter registry
    data_type: object
    required: true
    source: tests/case002/registry/parameters.yaml
  - id: IN-P1-ASSUMPTIONS
    description: Problem 1 physical and projection assumptions referenced by semantic id
    data_type: file
    required: true
    source: tests/case002/registry/assumptions.yaml
  - id: IN-P1-TARGET
    description: Fixed true-target cylinder geometry referenced from the parameter registry
    data_type: geometry
    required: true
    source: tests/case002/registry/parameters.yaml

symbols:
  variables:
    - {id: VAR-TIME, description: absolute task time, role: state, domain: nonnegative real, unit: s}
    - {id: VAR-MISSILE-POS, description: missile position and projection viewpoint, role: state, domain: R3, unit: m}
    - {id: VAR-UAV-POS, description: FY1 position, role: state, domain: R3, unit: m}
    - {id: VAR-BOMB-POS, description: smoke-bomb position before burst, role: state, domain: R3, unit: m}
    - {id: VAR-SMOKE-CENTER, description: active smoke-sphere centre, role: state, domain: R3, unit: m}
    - {id: VAR-VIEW-MATRIX, description: orthonormal world-to-camera rotation matrix, role: auxiliary, domain: 3 by 3 orthogonal matrix, unit: null}
    - {id: VAR-CAMERA-POINT, description: camera-coordinate representation of a world point, role: auxiliary, domain: R3 with positive depth, unit: m}
    - {id: VAR-IMAGE-POINT, description: homogeneous image-plane coordinate, role: auxiliary, domain: projective plane, unit: null}
    - {id: VAR-SMOKE-CONIC, description: symmetric matrix of the projected smoke tangent-cone conic, role: auxiliary, domain: 3 by 3 symmetric matrix, unit: null}
    - {id: VAR-TARGET-PROJECTION, description: perspective projection set of the full target cylinder, role: auxiliary, domain: subset of image plane, unit: null}
    - {id: VAR-SMOKE-PROJECTION, description: image-plane region blocked by the smoke sphere, role: auxiliary, domain: conic region, unit: null}
    - {id: VAR-EFFECTIVE-SET, description: time set satisfying full projection coverage and depth order, role: output, domain: subset of active interval, unit: s}
    - {id: VAR-DURATION, description: measure of the effective time set, role: output, domain: nonnegative real, unit: s}
  parameters:
    - {id: PAR-M1-P0, description: initial M1 position, unit: m, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-FAKE-TARGET, description: fake-target guidance point, unit: m, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-MISSILE-SPEED, description: missile speed, unit: m/s, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-FY1-P0, description: initial FY1 position, unit: m, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-FY1-DIRECTION, description: FY1 unit heading, unit: null, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-FY1-P1-SPEED, description: FY1 speed, unit: m/s, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-P1-RELEASE-TIME, description: release time, unit: s, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-P1-BURST-DELAY, description: release-to-burst delay, unit: s, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-GRAVITY, description: gravitational acceleration, unit: m/s^2, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-SMOKE-RADIUS, description: smoke-sphere radius, unit: m, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-SMOKE-SETTLING-SPEED, description: smoke-centre settling speed, unit: m/s, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-SMOKE-ACTIVE-DURATION, description: smoke active duration, unit: s, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-TARGET-BOTTOM-CENTER, description: target bottom-face centre, unit: m, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-TARGET-RADIUS, description: target cylinder radius, unit: m, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-TARGET-HEIGHT, description: target cylinder height, unit: m, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-TARGET-GEOMETRIC-CENTER, description: target geometric centre defining the camera normal, unit: m, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-VIEW-UP, description: view-frame reference vector, unit: null, source: tests/case002/registry/parameters.yaml}
    - {id: PAR-NORMALIZED-FOCAL-LENGTH, description: image-plane focal scale, unit: null, source: tests/case002/registry/parameters.yaml}

assumptions:
  - id: A-P1-MISSILE-UNIFORM
    statement: M1 follows the registered straight uniform trajectory during evaluation.
    status: accepted
    impact: fixes the moving camera origin
  - id: A-P1-UAV-UNIFORM
    statement: FY1 follows the registered horizontal constant-speed trajectory.
    status: accepted
    impact: fixes the release point
  - id: A-P1-BALLISTIC
    statement: The bomb inherits FY1 horizontal velocity and is acted on only by gravity after release.
    status: accepted
    impact: determines the burst point
  - id: A-P1-NO-DRIFT
    statement: Wind, drag and horizontal smoke drift are ignored.
    status: accepted
    impact: fixes smoke horizontal coordinates
  - id: A-P1-SPHERE
    statement: Active smoke is represented by a sphere with registered radius and settling motion.
    status: accepted
    impact: gives a tangent-cone conic on the image plane
  - id: A-P1-TARGET-CYLINDER
    statement: The target is the registered fixed solid cylinder.
    status: accepted
    impact: full coverage applies to its complete projection
  - id: A-P1-PINHOLE-VIEW
    statement: Observation uses a pinhole perspective plane perpendicular to the missile-to-target-centre sight direction.
    status: accepted
    impact: preserves angular scale and depth

model_components:
  - id: M-P1-KINEMATICS
    type: equation
    purpose: Determine missile, FY1, bomb and smoke-centre states symbolically.
    depends_on: [F-P1-MOTION-TRAJECTORIES, F-P1-BOMB-POSITION, F-P1-SMOKE-CENTER]
  - id: M-P1-CAMERA
    type: geometry
    purpose: Build the moving view plane and transform world points into two-dimensional perspective coordinates.
    depends_on: [F-P1-VIEW-MATRIX, F-P1-PERSPECTIVE-PROJECTION]
  - id: M-P1-PROJECTION-COVERAGE
    type: decision_rule
    purpose: Require complete projected target containment and correct smoke-before-target depth order.
    depends_on: [F-P1-SMOKE-CONIC, F-P1-PROJECTION-COVERAGE, F-P1-EFFECTIVE-DURATION]

formulas:
  - id: F-P1-MOTION-TRAJECTORIES
    expression: e_M=(r_O-r_M0)/||r_O-r_M0||; r_M(t)=r_M0+v_M t e_M; r_F(t)=r_F0+v_F t e_F
    description: Symbolic missile and FY1 trajectories.
    symbols: [VAR-MISSILE-POS, VAR-UAV-POS, VAR-TIME, PAR-M1-P0, PAR-FAKE-TARGET, PAR-MISSILE-SPEED, PAR-FY1-P0, PAR-FY1-DIRECTION, PAR-FY1-P1-SPEED]
    unit_check: pass
  - id: F-P1-BOMB-POSITION
    expression: r_d=r_F(t_d); t_b=t_d+tau_b; r_B(t)=r_d+v_F e_F(t-t_d)-g(t-t_d)^2 e_z/2
    description: Symbolic ballistic bomb trajectory.
    symbols: [VAR-BOMB-POS, VAR-UAV-POS, VAR-TIME, PAR-P1-RELEASE-TIME, PAR-P1-BURST-DELAY, PAR-FY1-P1-SPEED, PAR-FY1-DIRECTION, PAR-GRAVITY]
    unit_check: pass
  - id: F-P1-SMOKE-CENTER
    expression: r_C(t)=r_B(t_b)-v_s(t-t_b)e_z for t in [t_b,t_b+T_e]
    description: Symbolic active smoke-centre trajectory.
    symbols: [VAR-SMOKE-CENTER, VAR-BOMB-POS, VAR-TIME, PAR-SMOKE-SETTLING-SPEED, PAR-SMOKE-ACTIVE-DURATION]
    unit_check: pass
  - id: F-P1-VIEW-MATRIX
    expression: n=(r_Tc-r_M)/||r_Tc-r_M||; e_1=(k cross n)/||k cross n||; e_2=n cross e_1; R=[e_1^T;e_2^T;n^T]
    description: Time-dependent orthonormal view matrix with normal along the missile-target-centre sight.
    symbols: [VAR-VIEW-MATRIX, VAR-MISSILE-POS, PAR-TARGET-GEOMETRIC-CENTER, PAR-VIEW-UP]
    unit_check: not_applicable
  - id: F-P1-PERSPECTIVE-PROJECTION
    expression: x'=R(X-r_M); y_tilde=(f x'_1/x'_3, f x'_2/x'_3, 1)^T
    description: Perspective transformation from a three-dimensional world point to the two-dimensional image plane.
    symbols: [VAR-VIEW-MATRIX, VAR-CAMERA-POINT, VAR-IMAGE-POINT, VAR-MISSILE-POS, PAR-NORMALIZED-FOCAL-LENGTH]
    unit_check: not_applicable
  - id: F-P1-SMOKE-CONIC
    expression: c'=R(r_C-r_M); Q=K^{-T}[c'c'^T-(c'^Tc'-R_s^2)I]K^{-1}; Omega_S={y:y^TQy>=0}
    description: Image-plane conic region generated by the missile-to-smoke-sphere tangent cone.
    symbols: [VAR-VIEW-MATRIX, VAR-SMOKE-CENTER, VAR-MISSILE-POS, VAR-SMOKE-CONIC, VAR-SMOKE-PROJECTION, VAR-IMAGE-POINT, PAR-SMOKE-RADIUS, PAR-NORMALIZED-FOCAL-LENGTH]
    unit_check: pass
  - id: F-P1-PROJECTION-COVERAGE
    expression: Omega_T(t) subseteq Omega_S(t) and every target ray intersects the smoke sphere before its target point
    description: Complete target-projection coverage with the required depth order.
    symbols: [VAR-TARGET-PROJECTION, VAR-SMOKE-PROJECTION, VAR-IMAGE-POINT, PAR-SMOKE-RADIUS]
    unit_check: not_applicable
  - id: F-P1-EFFECTIVE-DURATION
    expression: "I={t in [t_b,t_b+T_e]: projection coverage and depth order hold}; Delta_t=measure(I)"
    description: Effective occlusion time set and duration.
    symbols: [VAR-EFFECTIVE-SET, VAR-DURATION, VAR-TIME, PAR-SMOKE-ACTIVE-DURATION]
    unit_check: pass

constraints:
  - id: C-P1-POSITIVE-DEPTH
    kind: hard
    description: Every projected target point must have positive camera depth.
    expression: x'_3>0
    symbols: [VAR-CAMERA-POINT]
    tolerance: 1.0e-12
    failure_signal: a target point lies on or behind the camera plane
  - id: C-P1-ACTIVE-WINDOW
    kind: hard
    description: Coverage is evaluated only during the registered smoke active interval.
    expression: t_b<=t<=t_b+T_e
    symbols: [VAR-TIME, PAR-SMOKE-ACTIVE-DURATION]
    tolerance: 1.0e-12
    failure_signal: an interval boundary lies outside the active interval
  - id: C-P1-FULL-PROJECTION
    kind: hard
    description: The complete target projection is contained in the smoke conic and all covered rays hit smoke before the target.
    expression: Omega_T subseteq Omega_S with valid ray depth
    symbols: [VAR-TARGET-PROJECTION, VAR-SMOKE-PROJECTION]
    tolerance: 1.0e-9
    failure_signal: any target projection point is uncovered or has invalid depth order

algorithm:
  method: deterministic perspective projection, conic containment, target-boundary refinement and Brent event roots
  deterministic: true
  steps:
    - id: STEP-P1-LOAD-REGISTRY
      description: Load all parameter values and assumptions by semantic id.
      uses: [IN-P1-KINEMATICS, IN-P1-ASSUMPTIONS, IN-P1-TARGET]
    - id: STEP-P1-KINEMATICS
      description: Compute release, burst and active smoke states.
      uses: [M-P1-KINEMATICS]
      produces: [VAR-MISSILE-POS, VAR-SMOKE-CENTER]
    - id: STEP-P1-PROJECT
      description: Build the view matrix and perspective-project the cylinder boundary and smoke tangent cone.
      uses: [M-P1-CAMERA, F-P1-SMOKE-CONIC]
      produces: [VAR-TARGET-PROJECTION, VAR-SMOKE-PROJECTION]
    - id: STEP-P1-COVERAGE
      description: Test conic containment and smoke-before-target ray intersections.
      uses: [F-P1-PROJECTION-COVERAGE, C-P1-FULL-PROJECTION]
      produces: [VAR-EFFECTIVE-SET]
    - id: STEP-P1-ROOT
      description: Scan the active interval and refine both coverage boundaries with Brent roots.
      uses: [VAR-EFFECTIVE-SET, C-P1-ACTIVE-WINDOW]
      produces: [VAR-DURATION]
  termination: Stop when time-step and target-boundary refinements each change duration by less than 0.001 s and all projection, depth and residual checks pass.
  complexity_note: The dominant cost is vectorized projection and ray-sphere evaluation over sampled cylinder-boundary points.

outputs:
  - id: OUT-P1-RELEASE-BURST
    description: Release point, burst time and burst point
    data_type: object
    unit: null
    depends_on: [F-P1-MOTION-TRAJECTORIES, F-P1-BOMB-POSITION]
    destination: tests/case002/results/problem1_result.json
    acceptance: Values agree with direct hand calculation.
  - id: OUT-P1-COVERAGE-INTERVAL
    description: Full perspective-projection coverage interval and duration
    data_type: object
    unit: s
    depends_on: [F-P1-PROJECTION-COVERAGE, F-P1-EFFECTIVE-DURATION]
    destination: tests/case002/results/problem1_result.json
    acceptance: Interval lies in the active window and both boundary residuals are below tolerance.

validation:
  checks:
    - id: V-P1-HAND-CALC
      type: analytic_case
      description: Verify release point, burst time and burst point by direct substitution.
      target_ids: [OUT-P1-RELEASE-BURST]
      acceptance: All registered hand-check values agree to numerical precision.
      required: true
      status: pass
      evidence: tests/case002/results/problem1_result.json
    - id: V-P1-VIEW-ORTHONORMAL
      type: residual
      description: Verify that the view matrix is orthonormal.
      target_ids: [VAR-VIEW-MATRIX]
      acceptance: Frobenius residual of R R^T-I is below 1e-10.
      required: true
      status: pass
      evidence: tests/case002/results/problem1_result.json
    - id: V-P1-PROJECTION-CONTAINMENT
      type: constraint
      description: Verify projected target containment and smoke-before-target ray intersections inside the effective interval.
      target_ids: [OUT-P1-COVERAGE-INTERVAL, C-P1-FULL-PROJECTION]
      acceptance: Every sampled target point passes both projection and depth tests.
      required: true
      status: pass
      evidence: tests/case002/results/problem1_result.json
    - id: V-P1-TIME-CONVERGENCE
      type: sensitivity
      description: Refine the time scan before root refinement.
      target_ids: [OUT-P1-COVERAGE-INTERVAL]
      acceptance: Maximum duration change is below 0.001 s.
      required: true
      status: pass
      evidence: tests/case002/results/problem1_result.json
    - id: V-P1-MESH-CONVERGENCE
      type: sensitivity
      description: Refine cylinder side and cap sampling.
      target_ids: [OUT-P1-COVERAGE-INTERVAL]
      acceptance: Finest two duration estimates differ by less than 0.001 s.
      required: true
      status: pass
      evidence: tests/case002/results/problem1_result.json
    - id: V-P1-BOUNDARY-RESIDUAL
      type: residual
      description: Verify that the worst sight-segment distance equals the smoke radius at both event boundaries.
      target_ids: [OUT-P1-COVERAGE-INTERVAL]
      acceptance: Maximum absolute distance residual is below 1e-7 m.
      required: true
      status: pass
      evidence: tests/case002/results/problem1_result.json
  sensitivity_policy:
    declared_before_final_result: true
    parameters: [PAR-NORMALIZED-FOCAL-LENGTH, PAR-TARGET-RADIUS, PAR-TARGET-HEIGHT]
    acceptance: Common focal scaling must not change containment, and declared time and mesh refinements must change duration by less than 0.001 s.

provenance:
  reference_exposure_status: independent
  source_artifacts:
    - id: SRC-PROBLEM-PDF
      location: tests/case002/local/problem/official/A题.pdf
      availability: local
      role: authoritative_input
      sha256: a37f6aad30b16ea09da9cb320ce194b12d3a28874008cf9ff19549f6c6079447
    - id: SRC-P1-PARAMETERS
      location: tests/case002/registry/parameters.yaml
      availability: repository
      role: derived_input
    - id: SRC-P1-ASSUMPTIONS
      location: tests/case002/registry/assumptions.yaml
      availability: repository
      role: derived_input
    - id: SRC-P1-SOLVER
      location: tests/case002/code/problem1_solver.py
      availability: repository
      role: implementation
    - id: SRC-P1-RESULT
      location: tests/case002/results/problem1_result.json
      availability: repository
      role: evidence
  evidence_paths:
    - tests/case002/results/problem1_result.json
    - tests/case002/review/independent_baseline.yaml

human_checkpoints:
  - id: H-P1-PROJECTION-DEFINITION
    decision: Use a missile-view perpendicular image plane, perspective matrix transformation and complete projected target coverage with depth order.
    authority: user
    status: approved
    record: tests/case002/review/problem1_definition_revision2.yaml

limitations:
  - Air resistance, wind and smoke deformation remain outside the current physical model.
  - Full continuous projection coverage is evaluated numerically on a refined cylinder boundary.
  - Mesh convergence supports numerical stability but is not a symbolic proof of the continuous extremum.

claims:
  allowed:
    - Under the registered assumptions, the full perspective-projection coverage interval is 8.056445489407 s to 9.448088158702 s and its duration is 1.391642669295 s.
    - The view matrix is orthonormal to numerical precision and the target projection passes conic containment and smoke-before-target depth checks inside the reported interval.
    - Time and target-boundary refinements each change the duration by less than 0.001 s.
  forbidden:
    - Plain orthographic projection without depth normalization is equivalent to missile visual observation.
    - Sampled target-boundary evidence is a symbolic proof of continuous coverage.

implementation:
  entrypoints:
    - path: tests/case002/code/problem1_solver.py
      role: solver
      availability: repository
  environment:
    python: ">=3.10"
    dependencies: [numpy, scipy]
  reproduction_command: python tests/case002/code/problem1_solver.py --output tests/case002/results/problem1_result.json
