schema_version: "1.0"
blueprint_id: PAPER-CASE002-P1-R1
project_id: case002
title: 2025 CUMCM A problem 1 first-review paper blueprint
status: frozen

source_specs:
  - spec_id: MODEL-CASE002-P1
    path: tests/case002/artifacts/modeling/problem1.model.yaml
    role: primary
    required_for_writing: true

numbering_policy:
  equations: global
  figures: chapter
  tables: chapter
  algorithms: chapter
  locked_before_writing: true

sections:
  - id: SEC-P1-INTERPRETATION
    title: 问题一题目解读
    order: 1
    purpose: Explain the geometry, prescribed schedule and full-cylinder occlusion target.
    content_blocks:
      - id: BLOCK-P1-SUMMARY
        type: problem_summary
        source_ids: [IN-P1-MISSILE, IN-P1-UAV-SCHEDULE, IN-P1-SMOKE, IN-P1-TARGET]
        disposition: body
  - id: SEC-P1-ASSUMPTIONS
    title: 模型假设
    order: 2
    purpose: Declare the short-time kinematic and geometric boundary of the model.
    content_blocks:
      - id: BLOCK-P1-ASSUMPTIONS
        type: assumptions
        source_ids: [A-P1-MISSILE-UNIFORM, A-P1-UAV-UNIFORM, A-P1-BALLISTIC, A-P1-NO-DRIFT, A-P1-SPHERE, A-P1-TARGET-CYLINDER]
        disposition: body
  - id: SEC-P1-MODEL
    title: 运动关系与遮蔽判据
    order: 3
    purpose: Define only the core kinematic equations and strict occlusion predicate.
    content_blocks:
      - id: BLOCK-P1-KINEMATICS
        type: model_definition
        source_ids: [M-P1-KINEMATICS]
        disposition: body
      - id: BLOCK-P1-OCCLUSION
        type: model_definition
        source_ids: [M-P1-FULL-OCCLUSION]
        disposition: body
      - id: BLOCK-P1-FORMULAS
        type: formula
        source_ids: [F-P1-MISSILE-POSITION, F-P1-UAV-POSITION, F-P1-BOMB-POSITION, F-P1-SMOKE-CENTER, F-P1-WHOLE-TARGET-MARGIN, F-P1-EFFECTIVE-DURATION]
        disposition: body
  - id: SEC-P1-NUMERICAL
    title: 数值求解
    order: 4
    purpose: Report hand checks, scan, root refinement and mesh convergence without implementation narration.
    content_blocks:
      - id: BLOCK-P1-ALGORITHM
        type: algorithm
        source_ids: [STEP-P1-HAND-CHECK, STEP-P1-SURFACE, STEP-P1-SCAN, STEP-P1-ROOT, STEP-P1-COMPARE]
        disposition: body
      - id: BLOCK-P1-VALIDATION
        type: validation
        source_ids: [V-P1-HAND-CALC, V-P1-ACTIVE-WINDOW, V-P1-MESH-CONVERGENCE, V-P1-TIME-CONVERGENCE, V-P1-CENTRE-BOUND, V-P1-ROOT-RESIDUAL]
        disposition: body
  - id: SEC-P1-RESULTS
    title: 结果与分析
    order: 5
    purpose: Give one compact table, compare the two predicates and state the answer.
    content_blocks:
      - id: BLOCK-P1-RESULT-TABLE
        type: table
        source_ids: [OUT-P1-RELEASE-BURST, OUT-P1-FULL-INTERVAL, OUT-P1-CENTRE-COMPARISON]
        disposition: body
      - id: BLOCK-P1-DISCUSSION
        type: discussion
        source_ids: [METRIC-P1-FULL-DURATION, METRIC-P1-CENTRE-DURATION]
        disposition: body
  - id: SEC-P1-ABSTRACT-MATERIAL
    title: 针对问题一的摘要素材
    order: 6
    purpose: Supply one provisional paragraph for a later global abstract without creating a title, keywords or full abstract.
    content_blocks:
      - id: BLOCK-P1-ABSTRACT-MATERIAL
        type: other
        source_ids: [OUT-P1-FULL-INTERVAL, OUT-P1-CENTRE-COMPARISON]
        disposition: body

model_placements:
  - {model_id: M-P1-KINEMATICS, source_spec_id: MODEL-CASE002-P1, owner_section_id: SEC-P1-MODEL, mode: define}
  - {model_id: M-P1-FULL-OCCLUSION, source_spec_id: MODEL-CASE002-P1, owner_section_id: SEC-P1-MODEL, mode: define}

formula_placements:
  - {formula_id: F-P1-MISSILE-POSITION, source_spec_id: MODEL-CASE002-P1, owner_section_id: SEC-P1-MODEL, mode: define, label: eq:p1-missile}
  - {formula_id: F-P1-UAV-POSITION, source_spec_id: MODEL-CASE002-P1, owner_section_id: SEC-P1-MODEL, mode: define, label: eq:p1-uav}
  - {formula_id: F-P1-BOMB-POSITION, source_spec_id: MODEL-CASE002-P1, owner_section_id: SEC-P1-MODEL, mode: define, label: eq:p1-bomb}
  - {formula_id: F-P1-SMOKE-CENTER, source_spec_id: MODEL-CASE002-P1, owner_section_id: SEC-P1-MODEL, mode: define, label: eq:p1-smoke}
  - {formula_id: F-P1-WHOLE-TARGET-MARGIN, source_spec_id: MODEL-CASE002-P1, owner_section_id: SEC-P1-MODEL, mode: define, label: eq:p1-occlusion}
  - {formula_id: F-P1-EFFECTIVE-DURATION, source_spec_id: MODEL-CASE002-P1, owner_section_id: SEC-P1-MODEL, mode: define, label: eq:p1-duration}

output_placements:
  - output_id: OUT-P1-RELEASE-BURST
    source_spec_id: MODEL-CASE002-P1
    owner_section_id: SEC-P1-NUMERICAL
    representation: text
    precision_policy: Coordinates retain 0.001 m where needed and burst time is shown to 0.1 s.
  - output_id: OUT-P1-FULL-INTERVAL
    source_spec_id: MODEL-CASE002-P1
    owner_section_id: SEC-P1-RESULTS
    representation: table
    label: tab:p1-results
    precision_policy: Report interval boundaries and duration to 0.001 s.
  - output_id: OUT-P1-CENTRE-COMPARISON
    source_spec_id: MODEL-CASE002-P1
    owner_section_id: SEC-P1-RESULTS
    representation: table
    label: tab:p1-results-centre
    precision_policy: Report interval boundaries and duration to 0.001 s.

claims:
  - id: CLAIM-P1-FULL-RESULT
    text: Under the declared assumptions, the full-cylinder effective occlusion interval is 8.056445489406 s to 9.448088158702 s and its duration is 1.391642669296 s.
    source_spec_id: MODEL-CASE002-P1
    owner_section_id: SEC-P1-RESULTS
    status: allowed
  - id: CLAIM-P1-CENTRE-RESULT
    text: The target-geometric-centre line-of-sight comparison duration is 1.435082101967 s.
    source_spec_id: MODEL-CASE002-P1
    owner_section_id: SEC-P1-RESULTS
    status: allowed
  - id: CLAIM-P1-NOT-COMPLETE
    text: The target-centre line-of-sight duration is the complete-target effective occlusion duration.
    source_spec_id: MODEL-CASE002-P1
    owner_section_id: SEC-P1-RESULTS
    status: forbidden

writing_constraints:
  new_modeling_content_forbidden: true
  recomputation_forbidden: true
  renumbering_forbidden: true
  unverified_claims_forbidden: true
  duplicate_definition_forbidden: true

human_checkpoints:
  - id: H-P1-REVIEW-STRUCTURE
    decision: Approve the problem-1-only review structure and full-cylinder primary result before drafting.
    authority: user
    status: approved
    record: tests/case002/review/problem1_scope_approval.yaml

evidence_paths:
  - tests/case002/results/problem1_result.json

limitations:
  - This blueprint covers problem 1 revision 1 only.
  - The global paper abstract, title, keywords and later-problem inheritance remain locked.
