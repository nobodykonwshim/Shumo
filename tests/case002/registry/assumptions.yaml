schema_version: 1
project_id: case002
presentation_policy: registry_only_not_repeated_in_latex
assumptions:
  - id: A-P1-MISSILE-UNIFORM
    owner_problem: problem1
    statement: M1 follows a straight uniform trajectory toward the fake target during the evaluation interval.
    status: accepted
    impact: fixes the moving camera origin used by the projection model
  - id: A-P1-UAV-UNIFORM
    owner_problem: problem1
    statement: FY1 instantaneously adopts the prescribed heading and then flies horizontally at constant speed.
    status: accepted
    impact: fixes the release point and inherited horizontal bomb velocity
  - id: A-P1-BALLISTIC
    owner_problem: problem1
    statement: after release the smoke bomb inherits FY1 horizontal velocity, has zero initial vertical velocity and is acted on only by gravity.
    status: accepted
    impact: determines the burst point
  - id: A-P1-NO-DRIFT
    owner_problem: problem1
    statement: air resistance, wind and horizontal smoke drift are ignored.
    status: accepted
    impact: the smoke centre keeps the burst point horizontal coordinates
  - id: A-P1-SPHERE
    owner_problem: problem1
    statement: the active smoke is a sphere with fixed registered radius and a centre that settles vertically at the registered speed.
    status: accepted
    impact: makes the projected shadow a conic generated by the missile-to-sphere tangent cone
  - id: A-P1-TARGET-CYLINDER
    owner_problem: problem1
    statement: the true target is a fixed solid vertical cylinder.
    status: accepted
    impact: full occlusion requires coverage of its complete perspective projection
  - id: A-P1-PINHOLE-VIEW
    owner_problem: problem1
    statement: missile observation is represented by a pinhole perspective projection on a plane perpendicular to the missile-to-target-centre sight direction.
    status: accepted
    impact: preserves angular size and depth, unlike a plain orthographic projection
reuse_policy:
  later_problems:
    - load assumptions by semantic id before modeling
    - inherit unchanged assumptions by reference
    - record any changed assumption as a new id
    - do not reproduce the assumption list in per-problem LaTeX
