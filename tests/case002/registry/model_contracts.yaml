schema_version: 2
project_id: case002
contracts:
  - id: MODEL-P1-PERSPECTIVE-OCCLUSION
    owner_problem: problem1
    status: solved_pending_paper_review
    inputs:
      - missile and FY1 kinematic parameters by registry id
      - smoke sphere parameters by registry id
      - true-target cylinder geometry by registry id
    transformation:
      camera_origin: missile position
      camera_normal: missile-to-target-geometric-centre unit vector
      view_matrix: time-dependent orthonormal basis
      image_mapping: pinhole perspective projection with depth normalization
    primary_predicate:
      - complete target projection lies inside the projected smoke tangent-cone conic
      - each covered ray intersects the smoke sphere before reaching its target point
    equivalent_evaluator: maximum point-to-sight-segment distance over the target is at most the smoke radius
    outputs:
      - full projection coverage interval
      - effective coverage duration
    reuse_boundary: later problems reuse the view matrix projection and coverage predicate by formula id after problem1 approval
