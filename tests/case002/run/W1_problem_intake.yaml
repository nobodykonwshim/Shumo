problem1:
  objective: calculate the interval for which the missile-view perspective projection of the true cylinder is completely covered by the smoke-sphere shadow projection, with smoke before the target on every sight ray
  prescribed_controls:
    uav: FY1
    heading: horizontally toward the fake target
    speed_m_per_s: 120
    release_time_s: 1.5
    burst_delay_after_release_s: 3.6
  required_outputs:
    - release_point_m
    - burst_absolute_time_s
    - burst_point_m
    - full_projection_coverage_start_s
    - full_projection_coverage_end_s
    - full_projection_coverage_duration_s
  precision:
    reported_time_s: 0.001
  dependencies: []
  acceptance:
    - release and burst points agree with independent hand calculation
    - all occlusion times lie inside the 20 s post-burst active window
    - duration changes by less than 0.001 s under denser target-boundary resolution
    - the view rotation matrix is orthonormal within tolerance
    - every sampled target projection lies inside the smoke conic and the corresponding ray intersects smoke before the target
