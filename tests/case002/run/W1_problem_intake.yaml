    - release_point_m
    - burst_absolute_time_s
    - burst_point_m
    - whole_cylinder_occlusion_start_s
    - whole_cylinder_occlusion_end_s
    - whole_cylinder_effective_duration_s
    - target_center_comparison_duration_s
  precision:
    reported_time_s: 0.001
  dependencies: []
  acceptance:
    - release and burst points agree with independent hand calculation
    - all occlusion times lie inside the 20 s post-burst active window
    - duration changes by less than 0.001 s under denser target-boundary resolution
    - whole-target duration does not exceed target-center comparison duration
