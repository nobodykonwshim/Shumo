schema_version: 1
case_id: case001
problem_id: problem4
stage: H3
status: candidate_c_selected_for_feasibility_validation

candidate_set: tests/case001/run/problem4_candidates/candidate_set_manifest.yaml
selection_authority: user
agent_may_select: false

candidates:
  P4-CAND-A:
    family: global_north_south_conservative_adaptive
    total_length_m: 620420.0
    uncovered_area_percent: 0.0
    excess_overlap_length_m: 369055.8064516127
    principal_risk: conservative_global_spacing_creates_large_local_overlap

  P4-CAND-B:
    family: global_east_west_conservative_adaptive
    total_length_m: 703760.0
    uncovered_area_percent: 0.0
    excess_overlap_length_m: 452776.95999999956
    principal_risk: longest_and_highest_overlap_burden_of_tested_candidates

  P4-CAND-C:
    family: terrain_responsive_curved_north_south
    total_length_m: 576755.7023466643
    uncovered_area_percent: 0.0
    excess_overlap_length_m: 339673.0975448946
    principal_risk: vessel_turning_and_curve_feasibility_not_yet_modeled

human_decision:
  selected_candidate_for_validation: P4-CAND-C
  selection_is_conditional: true
  accepted_reasons:
    - lowest evaluated survey-line length among the three bounded candidates
    - lowest evaluated excessive-overlap length among the three bounded candidates
    - zero sampled uncovered area and no boundary violation at frozen evaluator settings
  accepted_risks:
    - curved survey polylines may contain hard heading changes or insufficient local turn radius
    - implicit smoothing would change the evaluated route and is therefore forbidden
    - inter-line connecting turns are not yet represented
  rejected_candidates:
    - candidate_id: P4-CAND-B
      reason: longest tested route and highest tested excessive-overlap burden
  fallback_candidate_on_validation_failure: P4-CAND-A
  fallback_reason: straight within-line geometry avoids candidate C's unresolved curvature risk

feasibility_validation:
  specification: tests/case001/run/problem4_candidates/curvature_validation.yaml
  validator: skills/math_modeling/evaluators/route_feasibility.py
  candidate_plan: tests/case001/run/problem4_candidates/generated/P4-CAND-C.json
  report: tests/case001/run/problem4_candidates/generated/P4-CAND-C_feasibility.json
  state: pending_local_candidate_run
  blocking_conditions:
    - any nonzero heading change at an exact polyline vertex
    - any sampled local radius below a subsequently frozen positive minimum turn radius
    - missing or malformed generated candidate artifact
  pass_action: retain P4-CAND-C and reconfirm spatial metrics before baseline freeze
  fail_action: select P4-CAND-A and freeze it as the problem4 fallback baseline

selection_rule:
  - do not infer final choice from lowest reported length alone
  - candidate C must pass the exact-geometry feasibility validator before baseline freeze
  - no numerical vessel turning-radius limit may be invented without a frozen operational assumption
  - if candidate C fails, fall back to candidate A without attempting implicit route smoothing
  - no candidate may be described as globally optimal

handoff_after_validation:
  - retain C only after a passing feasibility report and reconfirmed spatial evaluation
  - otherwise freeze A as the problem4 fallback baseline
  - optionally open reference-comparison phase
  - build problem4.model.yaml only after the selected baseline is validated

pr_policy:
  keep_draft: true
  merge_allowed: false
