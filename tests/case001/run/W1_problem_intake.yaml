schema_version: 1
case_id: case001
stage: W1
status: inferred_pending_original_verification

provenance:
  original_problem_read: false
  reconstruction_sources:
    - B477.pdf
    - B226.pdf
    - B311.pdf
  rule: "Every requirement below must be checked against extracted B题.pdf and the supplied Excel files before W2."

problem_context:
  domain: multibeam_echo_sounding
  core_objects:
    - survey_vessel_track
    - multibeam_swath
    - seabed_surface
    - adjacent_swath_overlap
    - rectangular_or_irregular_survey_region
  primary_tradeoffs:
    - coverage_completeness
    - overlap_control
    - total_line_length

questions:
  problem1:
    objective:
      - establish a two-dimensional model for water depth, swath coverage width, and adjacent-swath overlap on a planar slope
      - calculate the required table values
    known_parameters_inferred:
      transducer_opening_angle_degree: 120
      seabed_slope_degree: 1.5
      center_depth_m: 70
      line_spacing_m: 200
      line_offsets_m: [-800, -600, -400, -200, 0, 200, 400, 600, 800]
    required_outputs:
      - water_depth_at_each_offset_m
      - coverage_width_at_each_offset_m
      - overlap_rate_with_previous_line_percent
      - result1.xlsx_preserving_original_schema
    constraints_and_definitions_to_verify:
      - beam fan is perpendicular to survey line
      - slope sign and east_west depth direction
      - exact overlap-rate definition on a slope
      - first row handling where no previous line exists
      - decimal precision required by result1.xlsx
    dependencies:
      attachments: [result1.xlsx]
    expected_execution: workflow

  problem2:
    objective:
      - extend the coverage-width model to three-dimensional geometry when survey-line direction varies relative to the horizontal projection of the seabed normal
      - calculate the required coverage-width table
    known_parameters_inferred:
      transducer_opening_angle_degree: 120
      seabed_slope_degree: 1.5
      center_depth_m: 120
      horizontal_distances_nautical_mile: [0, 0.3, 0.6, 0.9, 1.2, 1.5, 1.8, 2.1]
      beta_degree: [0, 45, 90, 135, 180, 225, 270, 315]
      nautical_mile_to_m: 1852
    required_outputs:
      - three_dimensional_depth_relation
      - effective_cross_track_slope_or_line_plane_angle_relation
      - coverage_width_for_each_distance_and_beta
      - result2.xlsx_preserving_original_schema
    constraints_and_definitions_to_verify:
      - exact definition and orientation of beta
      - direction in which distance is measured
      - coordinate-system sign convention
      - decimal precision required by result2.xlsx
    dependencies:
      formulas_reused_from_problem1:
        - depth_to_coverage_geometry
      attachments: [result2.xlsx]
    expected_execution: workflow

  problem3:
    objective:
      - design survey lines for a rectangular planar-slope region
      - completely cover the region
      - keep adjacent overlap between 10 and 20 percent
      - minimize total survey-line length
    known_parameters_inferred:
      north_south_length_nautical_mile: 2
      east_west_width_nautical_mile: 4
      center_depth_m: 110
      west_is_deeper_than_east: true
      seabed_slope_degree: 1.5
      transducer_opening_angle_degree: 120
      overlap_rate_percent_range: [10, 20]
    decision_variables:
      - survey_line_orientation
      - survey_line_count
      - survey_line_positions_or_spacings
    required_outputs:
      - line_orientation
      - ordered_line_positions
      - line_count
      - total_line_length
      - complete_coverage_evidence
      - overlap_constraint_evidence
      - survey_line_layout_figure
    inherited_models:
      - problem1_swath_and_overlap_model
      - problem2_directional_coverage_model
    reference_smoke_check:
      common_reported_line_count: 34
      common_reported_total_length_m: 125936
      ground_truth: false
    expected_execution: workflow_with_human_route_confirmation

  problem4:
    objective:
      - reconstruct or approximate the seabed from supplied single-beam sounding data
      - design multibeam survey lines whose swaths cover the region as fully as possible
      - keep overlap preferably not above 20 percent
      - minimize total survey-line length
      - evaluate the designed plan
    region_dimensions_inferred:
      north_south_length_nautical_mile: 5
      east_west_width_nautical_mile: 4
    required_attachment:
      filename: "附件.xlsx"
      current_status: not_extracted
      required_inspection:
        - sheet_names
        - coordinate_axes_and_units
        - row_and_column_dimensions
        - depth_sign_convention
        - missing_values
        - grid_spacing
        - duplicate_coordinates
        - outliers_or_obvious_errors
    decision_variables:
      - terrain_representation
      - region_partition_if_any
      - survey_line_orientation_by_location
      - line_geometry
      - line_spacing
      - objective_priority_or_weighting
    required_outputs:
      - complete_line_plan_with_coordinates_or_reproducible_geometry
      - total_line_length
      - uncovered_area_percentage
      - total_length_where_overlap_exceeds_20_percent
      - coverage_and_overlap_visualizations
      - independent_spatial_validation
    constraints_to_verify:
      - exact interpretation of "尽可能覆盖"
      - exact interpretation of "重叠率尽可能不超过20%"
      - whether survey lines must be straight, continuous, or connected
      - boundary handling outside the target rectangle
      - transducer opening angle and any fixed instrument parameters
    reference_disagreement:
      total_length_m_reported: [434662, 466394.4, 1151944]
      uncovered_percent_reported: [0.04, 2.3, 3.48]
      implication: "No reference value can be adopted without independent evaluation."
    expected_execution: blocked_before_attachment_read_then_bounded_route_exploration_candidate

cross_question_dependencies:
  - problem2_extends_problem1_geometry
  - problem3_uses_problem1_overlap_and_problem2_directional_coverage
  - problem4_reuses_coverage_principles_but_requires_new_terrain_and_spatial_evaluation_models

mandatory_verification_before_W2:
  - compare_every_question_wording_with_B题.pdf
  - confirm_all_numeric_parameters
  - inspect_result1_and_result2_workbook_schemas
  - inspect_attachment_xlsx
  - resolve_overlap_definition
  - resolve_coordinate_and_sign_conventions

open_issues:
  - id: OI-001
    severity: critical
    question: "Are the reconstructed problem statements and numeric parameters identical to the original B题.pdf?"
  - id: OI-002
    severity: critical
    question: "What is the exact schema and coordinate convention of 附件.xlsx?"
  - id: OI-003
    severity: major
    question: "Which overlap-rate definition is intended for sloping seabed and for problem4 spatial evaluation?"

handoff:
  allowed_to_G1_preliminary: true
  allowed_to_W2: false
