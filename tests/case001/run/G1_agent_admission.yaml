schema_version: 1
case_id: case001
stage: G1
status: verified
rule: "Agent admission decisions are based on original sources, error detectability, executable contracts and reference-isolation status."

reference_isolation:
  protocol: skills/math_modeling/support/REFERENCE_ISOLATION_PROTOCOL.md
  exposure_status: contaminated_for_blind_claim
  blind_claim_allowed: false
  implication: "This case tests provenance and bounded execution, not unknown-problem independence."

decisions:
  problem1:
    proposed_role: none
    decision: workflow
    reason: fixed planar geometry, fixed parameters, fixed output table and deterministic checks
    error_control:
      checks: [flat_seabed_limit, dimensional_check, monotonic_depth_check, table_recalculation]
      silent_failure_risk: low
    completion: pass

  problem2:
    proposed_role: none
    decision: workflow
    reason: coordinate geometry and special-angle tests fully specify the calculation
    error_control:
      checks:
        - beta_0_180_depth_direction_check
        - beta_45_315_symmetry
        - beta_135_225_symmetry
        - beta_90_270_constant_width
        - nautical_mile_conversion_check
      silent_failure_risk: low
    completion: pass

  problem3:
    proposed_role: none_during_phase_R1
    decision: workflow
    previous_decision: human_checkpoint
    checkpoint_resolution:
      approved_by: user
      selected_process: two_phase_independent_then_reference_comparison
      record: tests/case001/run/H1_problem3_route_decision.yaml
    reference_control:
      phase_R1: quarantined
      phase_R2: comparison_only_after_release
    error_control:
      checks:
        - complete_rectangle_coverage
        - every_adjacent_overlap_between_10_and_20_percent
        - total_length_recomputation
        - boundary_waste_comparison
        - reference_exposure_log_present
      silent_failure_risk: low_to_medium
    completion:
      modeling_packet: tests/case001/artifacts/modeling/problem3.model.yaml
      status: pass

  problem4:
    proposed_role: route_explorer
    decision: bounded_agent
    ambiguity:
      decision_tree_enumerable: false
      evidence: terrain representation, orientation, route geometry and multi-objective priorities admit materially different routes
    value:
      impact: high
      expected_gain_from_agent: compare_a_small_set_of_executable_route_families
    capability:
      completed:
        - deterministic_attachment_xlsx_adapter
        - independent_spatial_coverage_evaluator
        - frozen_ordered_previous_line_overlap_semantics
        - analytic_and_adapter_tests
        - real_251x201_grid_runtime_and_resolution_tests
        - candidate_route_environment_tool_and_prompt_contracts
        - executable_agent_admission_gate
        - quarantined_reference_access_state
        - hash_bound_gate_token
      evidence:
        evaluator_phase2: tests/case001/run/problem4_evaluator_phase2_status.yaml
        admission: tests/case001/run/problem4_agent_admission.json
        gate_token: tests/case001/run/problem4_agent_gate_token.json
        contracts: tests/case001/run/problem4_contracts/
        gate_ci: pass
    scope:
      allowed_actions:
        - generate_at_most_three_executable_candidates
        - request_independent_evaluation
        - submit_candidate_set_without_selecting_winner
      forbidden_actions:
        - reference_access
        - same_problem_web_search
        - final_route_selection
        - evaluator_or_metric_changes
        - registry_paper_or_pr_mutation
    budget:
      max_iterations: 3
      max_tool_calls: 8
      max_candidate_routes: 3
      used_iterations: 1
      used_tool_calls: 8
      used_candidate_routes: 3
    error_control:
      validators:
        - independent_spatial_evaluator
        - grid_resolution_sensitivity
        - boundary_violation_check
        - content_and_report_hashes
      silent_failure_risk: medium
    run:
      record: tests/case001/run/problem4_agent_run.yaml
      candidate_set: tests/case001/run/problem4_candidates/candidate_set_manifest.yaml
      status: completed_budget_exhausted
      route_explorer_started: true
      route_explorer_finished: true
      winner_selected: false
    next_stage:
      type: human_checkpoint
      record: tests/case001/run/H3_problem4_candidate_selection.yaml
      status: awaiting_user_selection

summary:
  workflow_completed: [problem1, problem2, problem3]
  bounded_agent_completed: [problem4_route_explorer]
  human_checkpoint_pending: [problem4_candidate_selection]
  blocked: []
  rationale: "Problem4 Agent execution was permitted only after independent evaluation, real-grid testing, contracts, reference quarantine and an executable hash-bound admission gate were all verified."
