schema_version: 1
case_id: case001
stage: G1
status: verified
rule: "Agent admission decisions are based on original sources, error detectability and reference-isolation status."

reference_isolation:
  protocol: skills/math_modeling/support/REFERENCE_ISOLATION_PROTOCOL.md
  exposure_status: contaminated_for_blind_claim
  blind_claim_allowed: false
  implication: "Current case may test provenance and quarantined reconstruction, but cannot prove unknown-problem independence."

decisions:
  problem1:
    proposed_role: none
    decision: workflow
    ambiguity:
      decision_tree_enumerable: true
      evidence: "Fixed planar geometry, fixed parameters, fixed table and deterministic limit checks."
    value:
      impact: medium
      expected_gain_from_agent: low
    error_control:
      checks: [flat_seabed_limit, dimensional_check, monotonic_depth_check, table_recalculation]
      silent_failure_risk: low
    approval_required: false

  problem2:
    proposed_role: none
    decision: workflow
    ambiguity:
      decision_tree_enumerable: true
      evidence: "Coordinate geometry and special-angle tests fully specify the calculation."
    value:
      impact: medium
      expected_gain_from_agent: low
    error_control:
      checks:
        - beta_0_180_depth_direction_check
        - beta_45_315_symmetry
        - beta_135_225_symmetry
        - beta_90_270_constant_width
        - nautical_mile_conversion_check
      silent_failure_risk: low
    approval_required: false

  problem3:
    proposed_role: none_during_phase_R1
    decision: workflow
    previous_decision: human_checkpoint
    checkpoint_resolution:
      approved_by: user
      selected_process: two_phase_independent_then_reference_comparison
      record: tests/case001/run/H1_problem3_route_decision.yaml
    ambiguity:
      decision_tree_enumerable: mostly
      evidence: "Orientation, boundary placement, recursive spacing and verification can be handled by a bounded deterministic search after problem1 and problem2 are fixed."
    value:
      impact: high
      expected_gain_from_agent: "Not evaluated until an independent or quarantined baseline is frozen."
    reference_control:
      phase_R1:
        reference_files_readable: false
        same_problem_web_search: forbidden
        route_explorer_allowed: false
      phase_R2:
        reference_files_readable: true_after_human_release
        purpose: comparison_only
    error_control:
      checks:
        - complete_rectangle_coverage
        - every_adjacent_overlap_between_10_and_20_percent
        - total_length_recomputation
        - boundary_waste_comparison
        - reference_exposure_log_present
      silent_failure_risk: low_to_medium
    approval_required: false_for_W2
    next_stage: W2_problem3

  problem4:
    proposed_role: route_explorer
    decision: blocked
    ambiguity:
      decision_tree_enumerable: false
      evidence: "Terrain representation, partition, line geometry and multi-objective priority admit materially different routes."
    value:
      impact: high
      expected_gain_from_agent: potentially_high
    capability:
      completed:
        - original_attachment_inspected
        - coordinate_grid_and_depth_range_verified
      unresolved_bottlenecks:
        - independent_spatial_coverage_evaluator_not_implemented
        - excessive_overlap_length_evaluator_not_implemented
        - candidate_route_tool_contracts_not_defined
    error_control:
      detectable_failures:
        - uncovered_grid_or_polygon_cells
        - overlap_above_threshold
        - line_outside_region
        - inconsistent_length_recomputation
      required_checks:
        - independent_grid_or_polygon_evaluator
        - grid_resolution_perturbation
        - region_boundary_tests
        - baseline_comparison
      silent_failure_risk: high
    unblock_conditions:
      - implement_independent_spatial_evaluator
      - define_agent_environment_and_tool_contracts
      - lower_silent_failure_risk_to_low_or_medium
      - define_reference_isolation_mode_for_route_exploration
    intended_future_decision: bounded_agent
    approval_required: true

summary:
  workflow: [problem1, problem2, problem3_phase_R1]
  human_checkpoint_resolved: [problem3_process_selection]
  blocked: [problem4]
  bounded_agent_now: []
  rationale: "Problem3 now tests deterministic independent-first orchestration. Agent exploration is deferred until a frozen baseline and explicit reference-release checkpoint exist."