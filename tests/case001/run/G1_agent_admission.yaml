schema_version: 1
case_id: case001
stage: G1
status: verified
rule: "Agent admission decisions are based on the original problem and inspected attachment."

decisions:
  problem1:
    proposed_role: none
    decision: workflow
    ambiguity:
      decision_tree_enumerable: true
      evidence: "Fixed planar geometry, fixed parameters, fixed table and deterministic limit checks."
    value:
      impact: medium
      expected_gain_from_agent: low
    error_control:
      checks: [flat_seabed_limit, dimensional_check, monotonic_depth_check, table_recalculation]
      silent_failure_risk: low
    approval_required: false

  problem2:
    proposed_role: none
    decision: workflow
    ambiguity:
      decision_tree_enumerable: true
      evidence: "Coordinate geometry and special-angle tests fully specify the calculation."
    value:
      impact: medium
      expected_gain_from_agent: low
    error_control:
      checks:
        - beta_0_180_depth_direction_check
        - beta_45_315_symmetry
        - beta_135_225_symmetry
        - beta_90_270_constant_width
        - nautical_mile_conversion_check
      silent_failure_risk: low
    approval_required: false

  problem3:
    proposed_role: route_explorer
    decision: human_checkpoint
    ambiguity:
      decision_tree_enumerable: mostly
      evidence: "The mature baseline is contour-parallel lines with recursive spacing; only boundary placement and proof strategy need bounded comparison."
    value:
      impact: high
      expected_gain_from_agent: limited
    error_control:
      checks:
        - complete_rectangle_coverage
        - every_adjacent_overlap_between_10_and_20_percent
        - total_length_recomputation
        - boundary_waste_comparison
      silent_failure_risk: medium
    scope:
      allowed_actions:
        - propose_at_most_3_boundary_and_spacing_routes
        - compare_cost_risk_and_validation_plan
      forbidden_actions:
        - select_final_route
        - modify_registry
        - write_final_paper
    budget:
      max_iterations: 2
      max_tool_calls: 4
      max_candidate_routes: 3
    approval_required: true

  problem4:
    proposed_role: route_explorer
    decision: blocked
    ambiguity:
      decision_tree_enumerable: false
      evidence: "Terrain representation, partition, line geometry and multi-objective priority admit materially different routes."
    value:
      impact: high
      expected_gain_from_agent: potentially_high
    capability:
      completed:
        - original_attachment_inspected
        - coordinate_grid_and_depth_range_verified
      unresolved_bottlenecks:
        - independent_spatial_coverage_evaluator_not_implemented
        - excessive_overlap_length_evaluator_not_implemented
        - candidate_route_tool_contracts_not_defined
    error_control:
      detectable_failures:
        - uncovered_grid_or_polygon_cells
        - overlap_above_threshold
        - line_outside_region
        - inconsistent_length_recomputation
      required_checks:
        - independent_grid_or_polygon_evaluator
        - grid_resolution_perturbation
        - region_boundary_tests
        - baseline_comparison
      silent_failure_risk: high
    unblock_conditions:
      - implement_independent_spatial_evaluator
      - define_agent_environment_and_tool_contracts
      - lower_silent_failure_risk_to_low_or_medium
    intended_future_decision: bounded_agent
    approval_required: true

summary:
  workflow: [problem1, problem2]
  human_checkpoint: [problem3]
  blocked: [problem4]
  bounded_agent_now: []
  rationale: "Original-source verification did not change the workflow-first routing. Attachment availability closes ingestion but does not justify problem4 autonomy without an evaluator."
