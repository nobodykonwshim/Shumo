schema_version: 2

project:
  id: case001
  title: "多波束测线问题实战验证"
  competition: "CUMCM-2023-B"
  language: zh-CN
  timezone: Asia/Shanghai
  root: "tests/case001/"
  purpose: "验证 workflow-first、agent-gated 三层架构的真实可执行性"

paths:
  source_manifest: "tests/case001/problem/source_manifest.yaml"
  local_problem_archive: "tests/case001/local/problem/B题.rar"
  local_reference_papers: "tests/case001/local/references/"
  expected:
    acceptance: "tests/case001/expected/acceptance.yaml"
    reference_benchmarks: "tests/case001/expected/reference_benchmarks.yaml"
  run_artifacts: "tests/case001/run/"
  review_artifacts: "tests/case001/review/"
  modeling_artifacts: "tests/case001/artifacts/modeling/"
  architecture_artifacts: "tests/case001/artifacts/architecture/"
  results: "tests/case001/results/"
  figures: "tests/case001/figures/"
  sections: "tests/case001/sections/"
  spatial_evaluator: "skills/math_modeling/evaluators/spatial_coverage.py"
  attachment_adapter: "skills/math_modeling/evaluators/xlsx_depth_grid.py"
  executable_agent_gate: "skills/math_modeling/orchestration/agent_gate.py"

units:
  system: SI
  length: m
  area: m2
  angle: rad
  nautical_mile_to_m: 1852
  source_angle_unit: degree
  conversion_required_before_modeling: true

orchestration:
  mode: workflow_first
  workflow_map: "skills/math_modeling/workflows/README.md"
  default_entry: router
  allowed_agent_slots:
    - route_explorer
    - diagnostic_agent
    - solution_reviewer
  forbid_unregistered_agent_types: true
  require_human_route_decision: true
  require_modeling_packet: true
  require_paper_blueprint: true
  allow_direct_paper_writing: false
  require_registry_update: true
  require_validation_before_writing: true

agent_policy:
  admission_gate: "skills/math_modeling/support/AGENT_ADMISSION_GATE.md"
  runtime_contract: "skills/math_modeling/support/AGENT_RUNTIME_CONTRACT.md"
  require_admission_record: true
  require_environment_manifest: true
  require_tool_contracts: true
  require_prompt_contract: true
  require_rollback_point: true
  require_error_detection: true
  require_executable_gate_token: true
  default_decision: workflow
  silent_failure_risk:
    default_allowed: low
    bounded_agent_exception: medium_only_with_independent_validator_and_human_checkpoint
  global_budget:
    max_iterations: 6
    max_tool_calls: 12
    max_candidate_routes: 4
  stop_conditions:
    - budget_exhausted
    - two_iterations_without_new_evidence
    - unverifiable_critical_assumption
    - tool_state_conflict
    - global_artifact_contamination_risk
    - human_value_judgment_required

workflow_policy:
  deterministic_steps_required_for:
    - project_initialization
    - problem_intake
    - unit_conversion
    - parameter_registration
    - model_specification
    - standard_implementation
    - result_validation
    - registry_updates
    - paper_architecture
    - paper_writing
    - delivery_checks
  validation_rules_predefined_when_possible: true
  fixed_failure_tree_before_diagnostic_agent: true
  stop_on_unreadable_original_problem: true
  stop_on_unreadable_required_attachment: true

case_policy:
  reference_papers_are_ground_truth: false
  reference_papers_are_comparison_baselines: true
  require_original_problem_verification: true
  require_attachment_schema_inspection: true
  require_reference_disagreement_report: true
  forbid_copying_reference_prose: true
  binary_materials_commit_policy: local_only

reference_isolation:
  protocol: "skills/math_modeling/support/REFERENCE_ISOLATION_PROTOCOL.md"
  default_mode: independent_first_reference_second
  authoritative_sources:
    - B题.pdf
    - 附件.xlsx
    - result1.xlsx
    - result2.xlsx
  external_reference_sources:
    - B477.pdf
    - B226.pdf
    - B311.pdf
    - tests/case001/expected/reference_benchmarks.yaml
  require_exposure_log: true
  exposure_log: "tests/case001/review/reference_exposure_log.yaml"
  require_baseline_freeze_before_reference_release: true
  same_problem_web_search_before_baseline_freeze: forbidden
  current_status: contaminated_for_blind_claim
  blind_claim_allowed: false
  current_treatment: reference_quarantined_reconstruction
  problem4_route_explorer_state: quarantined
  true_blind_validation_requires_fresh_case_or_context: true

modeling:
  stable_formula_ids: true
  final_equation_numbers: false
  minimum_candidate_routes: 2
  maximum_candidate_routes: 4
  validation_required:
    - residual_or_constraint_check
    - boundary_or_hand_check
    - stability_or_sensitivity_check
    - result_file_integrity_check
  allow_partial_result: true
  partial_result_must_be_labeled: true

problem4_evaluation:
  phase: 3
  attachment_adapter_status: verified
  evaluator_status: analytic_and_real_grid_tests_pass
  route_generator_independent: true
  metric_policy:
    uncovered_area: raster_cell_center
    excessive_overlap_length: ordered_previous_line
    excessive_overlap_threshold: 0.20
    physical_pair_double_counting: prohibited
  implemented:
    - total_line_length
    - uncovered_area_percentage
    - multiply_covered_area_percentage
    - excessive_overlap_length
    - outside_region_length
    - grid_resolution_sensitivity
    - deterministic_xlsx_grid_adapter
    - contract_hash_verification
    - executable_agent_admission_gate
  real_grid_evidence: "tests/case001/run/problem4_real_grid_smoke_report.json"
  admission: "tests/case001/run/problem4_agent_admission.json"
  gate_token: "tests/case001/run/problem4_agent_gate_token.json"
  contracts: "tests/case001/run/problem4_contracts/"
  route_explorer_allowed: true
  route_explorer_status: completed_budget_exhausted
  candidate_set: "tests/case001/run/problem4_candidates/candidate_set_manifest.yaml"
  final_route_selected: false

paper_architecture:
  equation_numbering: global
  figure_numbering: chapter
  table_numbering: chapter
  one_owner_per_formula: true
  one_owner_per_model: true
  common_assumptions_once: true
  common_symbol_table_once: true
  formula_reuse_policy: reference_only

paper_writing:
  style: formal_academic
  final_formats:
    - latex
  include_tool_process_in_body: false
  include_failed_routes_in_body: false
  result_explanation_level: concise
  editable_equations_required: true
  exploration_agents_forbidden: true

quality_gates:
  source_to_intake:
    - original_problem_readable
    - required_attachments_readable
    - source_hashes_recorded
  intake_to_modeling:
    - all_questions_identified
    - outputs_and_constraints_verified
    - missing_information_resolved_or_blocked
  independent_modeling_to_reference_release:
    - reference_exposure_status_recorded
    - independent_baseline_frozen
    - baseline_hash_recorded
    - human_reference_release_approved
  problem4_evaluator_phase1:
    - route_generator_independence_declared
    - analytic_flat_plane_tests_pass
    - analytic_sloped_plane_test_pass
    - boundary_violation_test_pass
    - grid_sensitivity_reported
  problem4_evaluator_to_agent:
    - attachment_grid_adapter_verified
    - real_grid_resolution_stable
    - excessive_overlap_metric_frozen
    - candidate_route_tool_contracts_defined
    - executable_agent_gate_passed
    - reference_access_quarantined
    - hash_bound_gate_token_issued
  problem4_agent_to_human_selection:
    - no_more_than_three_candidates
    - every_candidate_independently_evaluated
    - candidate_and_report_hashes_recorded
    - no_winner_selected_by_agent
    - limitations_recorded
  modeling_to_architecture:
    - outputs_covered
    - route_decision_recorded
    - reproducible_model_and_algorithm
    - quantitative_validation
    - agent_actions_auditable
    - provenance_and_reference_adoptions_recorded
    - no_open_critical_review_findings
  architecture_to_writing:
    - unique_model_ownership
    - unique_formula_labels
    - inheritance_and_new_content_defined
    - no_open_critical_issues
  writing_to_delivery:
    - no_redefinition
    - no_number_conflict
    - result_attachment_consistency
    - required_outputs_present

status:
  current_stage: H3_problem4_candidate_selection
  state: awaiting_user_selection
  blocker: "Final problem4 route selection is a human value and feasibility judgment."
  note: "Problems 1-3 are complete. Problem4 has three bounded, independently evaluated candidates; no final route or global-optimality claim has been made."
